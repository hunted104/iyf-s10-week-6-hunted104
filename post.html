<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>
</head>
<body>
    <h1>Create a New Post</h1>
<form id="post-form">
    <input type="text" id="title" placeholder="Title" required ><br><br>
    <textarea id="body" placeholder="Write your post here..." required></textarea><br><br>
    <input type="number" id="userId" placeholder="USER ID" required ><br><br>
    <button type="submit">submit</button>
</form>
<h2>Result:</h2>
<div id="result"></div>

<script>
    const form = document.getElementById("post-form");
const resultDiv = document.getElementById("result");

// Function to create post
async function createPost(title, body, userId) {
    const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            body: body,
            userId: userId
        })
    });

    if (!response.ok) {
        throw new Error("Failed to create post");
    }

    return await response.json();
}

// Handle form submission
form.addEventListener("submit", async (e) => {
    e.preventDefault(); // prevent page reload

    const title = document.getElementById("title").value;
    const body = document.getElementById("body").value;
    const userId = document.getElementById("userId").value;

    try {
        const newPost = await createPost(title, body, userId);

        resultDiv.innerHTML = `
            <h3>Post Created Successfully!</h3>
            <p><strong>ID:</strong> ${newPost.id}</p>
            <p><strong>Title:</strong> ${newPost.title}</p>
            <p><strong>Body:</strong> ${newPost.body}</p>
        `;
    } catch (error) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
    }
});
</script>
</body>
</html>
