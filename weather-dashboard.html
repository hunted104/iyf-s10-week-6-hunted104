<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color:#333;
  padding:20px;
}

.weather-app {
  max-width:900px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

input, button {
  padding:10px;
  margin:5px;
}

.hidden { display:none; }

.forecast {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
}

.card {
  background:#f0f2ff;
  padding:10px;
  border-radius:8px;
  text-align:center;
}
</style>
</head>

<body>

<div class="weather-app">
  <h1>Weather Dashboard</h1>

  <form id="form">
    <input type="text" id="city" placeholder="Enter city" required>
    <button>Search</button>
  </form>

  <p id="loading" class="hidden">Loading...</p>
  <p id="error" class="hidden"></p>

  <div id="current" class="hidden">
    <h2 id="name"></h2>
    <p id="temp"></p>
    <p id="desc"></p>
  </div>

  <h3 id="forecast-title" class="hidden">Forecast</h3>
  <div id="forecast" class="forecast"></div>

  <h3>Recent Searches</h3>
  <ul id="history"></ul>
</div>

<script>
     const API_KEY = "67187ba9e7ac9a4707406a665e0188c0";
const BASE_URL = "https://api.openweathermap.org/data/2.5/weather";

// DOM
const form = document.getElementById("form");
const cityInput = document.getElementById("city");
const loading = document.getElementById("loading");
const error = document.getElementById("error");

const nameEl = document.getElementById("name");
const tempEl = document.getElementById("temp");
const descEl = document.getElementById("desc");
const currentEl = document.getElementById("current");

const forecastEl = document.getElementById("forecast");
const forecastTitle = document.getElementById("forecast-title");

const historyEl = document.getElementById("history");

// MAIN FUNCTION
async function getWeather(city) {
  try {
    showLoading();
    hideError();

    // CURRENT WEATHER
    const res1 = await fetch(
      `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
    );

    if (!res1.ok) throw new Error("City not found");

    const data1 = await res1.json();

    // FORECAST (3-hour intervals)
    const res2 = await fetch(
      `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`
    );

    const data2 = await res2.json();

    displayCurrent(data1);
    displayForecast(data2.list);

    saveHistory(city);

  } catch (err) {
    showError(err.message);
  } finally {
    hideLoading();
  }
}

// CURRENT WEATHER
function displayCurrent(data) {
  nameEl.textContent = data.name;
  tempEl.textContent = Math.round(data.main.temp) + "°C";
  descEl.textContent = data.weather[0].description;

  currentEl.classList.remove("hidden");
}

// FORECAST
function displayForecast(list) {
  forecastEl.innerHTML = "";
  forecastTitle.classList.remove("hidden");

  // pick 1 per day (every 8th)
  const daily = list.filter((item, i) => i % 8 === 0);

  daily.slice(0,5).forEach(item => {
    const date = new Date(item.dt * 1000);
    const day = date.toLocaleDateString("en-US",{weekday:"short"});

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h4>${day}</h4>
      <p>${Math.round(item.main.temp)}°C</p>
      <p>${item.weather[0].description}</p>
    `;

    forecastEl.appendChild(div);
  });
}

// HISTORY
function saveHistory(city) {
  let history = JSON.parse(localStorage.getItem("history")) || [];

  history.unshift(city);
  history = [...new Set(history)].slice(0,5);

  localStorage.setItem("history", JSON.stringify(history));
  loadHistory();
}

function loadHistory() {
  let history = JSON.parse(localStorage.getItem("history")) || [];

  historyEl.innerHTML = "";

  history.forEach(city => {
    const li = document.createElement("li");
    li.textContent = city;

    li.onclick = () => getWeather(city);

    historyEl.appendChild(li);
  });
}

// UI
function showLoading() {
  loading.classList.remove("hidden");
}

function hideLoading() {
  loading.classList.add("hidden");
}

function showError(msg) {
  error.textContent = msg;
  error.classList.remove("hidden");
}

function hideError() {
  error.classList.add("hidden");
}

// EVENT
form.addEventListener("submit", e => {
  e.preventDefault();
  const city = cityInput.value.trim();
  if (city) getWeather(city);
});

// INIT
loadHistory();
</script>

</body>
</html>
